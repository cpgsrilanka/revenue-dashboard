name: Nightly Reservations Ingestion

on:
  schedule:
    # 21:30 UTC = 03:00 Sri Lanka time (UTC+5:30) — runs after properties'
    # daily exports are expected to be updated.
    - cron: "30 21 * * *"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ingestion/package-lock.json

      - run: npm install

      - run: npm run ingest
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Nightly alert email (optional) — leave the two secrets unset in
          # GitHub to skip email alerts entirely; ingest.js degrades gracefully.
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_ALWAYS: ${{ vars.ALERT_ALWAYS }}
