name: Nightly Reservations Ingestion

on:
  schedule:
    # 21:30 UTC = 03:00 Sri Lanka time (UTC+5:30) — runs after properties'
    # daily exports are expected to be updated.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate files without writing to Supabase"
        required: true
        default: true
        type: boolean

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ingestion/package-lock.json

      - run: npm install

      - name: Run ingestion
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            command=(npm run ingest:dry-run)
          else
            command=(npm run ingest)
          fi

          for attempt in 1 2 3; do
            if "${command[@]}"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Ingestion attempt $attempt failed. Retrying in $((attempt * 30)) seconds..."
              sleep $((attempt * 30))
            fi
          done

          exit 1
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
